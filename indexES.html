<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConkyForge V10.41.1</title>

    <!-- EL MOTOR MÁGICO DE TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 👇 ESTA ES LA LÍNEA VITAL PARA EL ZIP 👇 -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- TU CSS ORIGINAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ESTILOS EXTRA PARA SCROLL -->
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-300 font-sans h-screen flex overflow-hidden selection:bg-cyan-500 selection:text-white m-0">

    <!-- BARRA LATERAL (Sidebar) -->
    <div id="sidebar" class="w-80 bg-slate-800 border-r border-slate-700 p-4 flex flex-col gap-4 overflow-y-auto custom-scrollbar shadow-2xl z-10 shrink-0">

        <h2 class="text-green-400 font-bold text-lg border-b border-slate-700 pb-2 mb-2 flex items-center gap-2">
            <span>🛠️</span> ConkyForge V10.41.1
        </h2>

        <!-- Paleta de Colores -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex justify-between items-center">
                <span>🎨 Paleta Hex</span>
                <a href="https://htmlcolorcodes.com/es/" target="_blank" class="text-cyan-400 hover:text-cyan-300 text-[10px] border border-cyan-800 hover:border-cyan-400 px-2 py-1 rounded transition-colors no-underline">Ver Chuleta</a>
            </h2>
            <div class="grid grid-cols-2 gap-2">
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-text" value="#f8f8f2" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">Texto Base</label>
                </div>
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-accent" value="#8be9fd" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">Acento</label>
                </div>
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-cpu" value="#bd93f9" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">CPU</label>
                </div>
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-ram" value="#50fa7b" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">RAM</label>
                </div>
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-disk" value="#f1fa8c" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">Disco</label>
                </div>
                <div class="flex items-center gap-2 bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500 transition-colors">
                    <input type="color" id="color-temp" value="#ff5555" class="w-6 h-6 border-0 p-0 cursor-pointer rounded bg-transparent">
                    <label class="text-[10px] text-slate-300 cursor-pointer">Temp</label>
                </div>
            </div>
        </div>

        <!-- Ajustes Globales -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">⚙️ Ajustes</h2>

            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="block text-[10px] text-cyan-400 mb-1">Ancho (px):</label>
                    <input type="number" id="config-width" value="400" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-[10px] text-cyan-400 mb-1">Alto (px):</label>
                    <input type="number" id="config-height" value="1000" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="block text-[10px] text-green-400 font-bold mb-1">Zoom Web:</label>
                    <input type="number" id="config-scale" value="1.0" step="0.1" min="0.5" max="4.0" class="w-full bg-slate-800 border border-green-700 focus:border-green-400 text-white rounded px-2 py-1 text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-red-400 font-bold mb-1">Interlineado (Y):</label>
                    <input type="number" id="config-lineheight" value="16" min="10" max="30" class="w-full bg-slate-800 border border-red-700 focus:border-red-400 text-white rounded px-2 py-1 text-xs focus:outline-none">
                </div>
            </div>

            <div class="flex gap-2 mb-2">
                <div class="flex-grow">
                    <label class="block text-[10px] text-purple-400 font-bold mb-1">Fuente del Sistema:</label>
                    <div class="flex gap-1">
                        <select id="config-font" class="w-full bg-slate-800 border border-purple-700 focus:border-purple-400 text-white rounded px-2 py-1 text-xs focus:outline-none">
                            <option value="DejaVu Sans">DejaVu Sans</option>
                            <option value="Ubuntu">Ubuntu</option>
                            <option value="Noto Sans">Noto Sans</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Hack">Hack (Mono)</option>
                            <option value="Fira Code">Fira Code (Mono)</option>
                            <option value="Liberation Sans">Liberation Sans</option>
                            <option value="Arial">Arial</option>
                            <option value="CUSTOM">Personalizada...</option>
                        </select>
                        <input type="text" id="config-font-custom" placeholder="Ej: Terminus" class="hidden w-1/2 bg-slate-800 border border-purple-700 text-white rounded px-2 py-1 text-xs focus:outline-none">
                    </div>
                </div>
                <div class="w-16">
                    <label class="block text-[10px] text-purple-400 font-bold mb-1">Grosor:</label>
                    <input type="number" id="config-thickness" value="14" min="1" max="40" class="w-full bg-slate-800 border border-purple-700 focus:border-purple-400 text-white rounded px-2 py-1 text-xs focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="block text-[10px] text-cyan-400 mb-1">Alineación:</label>
                    <select id="config-align" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400">
                        <option value="top_right">Arriba Derecha</option>
                        <option value="top_left">Arriba Izquierda</option>
                        <option value="bottom_right">Abajo Derecha</option>
                        <option value="bottom_left">Abajo Izquierda</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-cyan-400 mb-1">ID Monitor:</label>
                    <input type="number" id="config-monitor" value="1" min="0" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <div class="mt-2">
                <label class="block text-[10px] text-cyan-400 mb-1">Ruta Absoluta del Script Lua:</label>
                <input type="text" id="config-luapath" value="/home/usuario/.config/conky/visuals.lua" class="w-full bg-slate-800 border border-slate-600 text-white rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400 font-mono">
            </div>

            <button class="w-full mt-3 py-1 bg-slate-700 hover:bg-slate-600 border border-slate-500 rounded text-xs text-white transition-colors flex items-center justify-center gap-2 shadow-sm tool-btn" id="toggle-preview">
                👁️ Modo Vista Previa
            </button>
        </div>

        <!-- Módulos: Sistema y Hardware -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">🛠️ Hardware</h2>
            <div class="grid grid-cols-2 gap-1.5">
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-cpu">⚙️ CPU</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-ram">🧠 RAM</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-disk">💾 Disco</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-disk-lua">💾 Discos Lua</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-temp">🌡️ Temp</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-kernel">🐧 Kernel</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-cyan-800 hover:border-cyan-500 font-bold rounded px-2 py-1 text-xs text-left text-cyan-200 transition-colors" id="add-fan">🌀 Ventilador</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-top-cpu">🔥 Top CPU</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-top-ram">💥 Top RAM</button>
            </div>
        </div>

        <!-- Módulos: Red y Extras -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">🌐 Red y Extras</h2>
            <div class="grid grid-cols-2 gap-1.5">
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-cyan-800 hover:border-cyan-500 font-bold rounded px-2 py-1 text-xs text-left text-cyan-200 transition-colors" id="add-clock">🕒 Reloj</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-800 hover:border-green-500 font-bold rounded px-2 py-1 text-xs text-left text-green-200 transition-colors" id="add-weather">☀️ Clima</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-weather-pro">⛅ Weather Pro</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-purple-800 hover:border-purple-500 font-bold rounded px-2 py-1 text-xs text-left text-purple-200 transition-colors" id="add-media">[▶] Media</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-purple-800 hover:border-purple-500 font-bold rounded px-2 py-1 text-xs text-left text-purple-200 transition-colors" id="add-audacious">🎵 Audacious</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-net">🌐 Red</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-ip">🌍 IP Púb</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-email">✉️ Email</button>
                <button class="tool-btn col-span-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-center text-slate-300 transition-colors" id="add-graph-net">📉 Gráfico Red</button>
            </div>
        </div>

        <!-- Módulos: Matriz Lua -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 mb-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">📊 Matriz Lua (Cairo)</h2>
            <div class="grid grid-cols-2 gap-1.5">
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-red-800 hover:border-red-500 font-bold rounded px-2 py-1 text-xs text-left text-red-200 transition-colors" id="add-text-horiz">🔡 Txt Horiz</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-red-800 hover:border-red-500 font-bold rounded px-2 py-1 text-xs text-left text-red-200 transition-colors" id="add-text-vert">🔠 Txt Vert</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-line">➖ Recta</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-line-diag">📐 Diagonal</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-geometry">⭕ Geom</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-400 text-green-400 rounded px-2 py-1 text-xs text-left shadow-[0_0_5px_rgba(80,250,123,0.3)] transition-colors" id="add-neon">⚡ Neón</button>
                <button class="tool-btn col-span-2 bg-slate-800 hover:bg-slate-700 border border-cyan-600 font-bold rounded px-2 py-1 text-xs text-center text-cyan-200 transition-colors" id="add-analog-clock">🧭 RELOJ ANALÓGICO</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-yellow-400 text-yellow-300 rounded px-2 py-1 text-xs text-left shadow-[0_0_5px_rgba(241,250,140,0.3)] transition-colors" id="add-ticker">📈 Ticker</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-cyan-400 text-cyan-300 rounded px-2 py-1 text-xs text-left transition-colors" id="add-globe">🌐 Globo 3D</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-700 hover:border-green-500 rounded px-2 py-1 text-xs text-left text-green-200 transition-colors" id="add-image">🖼️ PNG</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-700 hover:border-green-500 font-bold rounded px-2 py-1 text-xs text-left text-green-200 transition-colors" id="add-anim-png">🎬 PNG Anim</button>

                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-purple-700 hover:border-purple-400 rounded px-2 py-1 text-xs text-left text-purple-200 transition-colors" id="add-ring-cpu">🟣 Anillo CPU</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-700 hover:border-green-400 rounded px-2 py-1 text-xs text-left text-green-200 transition-colors" id="add-ring-ram">🟢 Anillo RAM</button>

                <button class="tool-btn col-span-2 bg-slate-800 hover:bg-slate-700 border border-red-700 font-bold rounded px-2 py-1 text-xs text-center text-red-200 transition-colors" id="add-ring-gpu-dual">🎯 DUAL GPU</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-green-700 hover:border-green-400 rounded px-2 py-1 text-xs text-left text-green-200 transition-colors" id="add-spiral-rev">🌀 Espiral Inv</button>
                <button class="tool-btn col-span-2 bg-slate-800 hover:bg-slate-700 border border-purple-700 font-bold rounded px-2 py-1 text-xs text-center text-purple-200 transition-colors" id="add-spiral-dna">🧬 ADN</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-cyan-700 hover:border-cyan-400 rounded px-2 py-1 text-xs text-left text-cyan-200 transition-colors" id="add-graph-fluid">🌊 Fluido</button>

                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-purple-700 hover:border-purple-400 rounded px-2 py-1 text-xs text-left text-purple-200 transition-colors" id="add-eq-cpu">📶 Barras EQ</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-eq-horiz">🎚️ EQ Horiz</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-eq-circ">🎇 Radial</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-eq-circ-open">🎛️ Radial Ab.</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-eq-concent">🎯 Concent.</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-eq-concent-open">⏱️ Concent. Ab.</button>
                <button class="tool-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 rounded px-2 py-1 text-xs text-left text-slate-300 transition-colors" id="add-graph-cpu">📈 Gráfico</button>
            </div>
        </div>
    </div>

    <!-- ZONA CENTRAL Y BARRA SUPERIOR -->
    <div class="flex flex-col flex-1 relative bg-slate-950">

        <!-- Botonera de Proyecto Flotante -->
        <div class="absolute top-4 right-6 z-20 flex items-center gap-2 bg-slate-800/90 p-2 rounded-lg border border-slate-700 shadow-xl backdrop-blur">
            <button class="tool-btn w-8 h-8 flex items-center justify-center rounded border border-green-600/50 hover:bg-green-600/20 text-green-400 transition-colors tooltip relative group" id="btn-save">
                💾
                <span class="absolute -bottom-8 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Guardar</span>
            </button>
            <button class="tool-btn w-8 h-8 flex items-center justify-center rounded border border-cyan-600/50 hover:bg-cyan-600/20 text-cyan-400 transition-colors tooltip relative group" id="btn-load">
                📂
                <span class="absolute -bottom-8 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Cargar</span>
            </button>
            <button class="tool-btn w-8 h-8 flex items-center justify-center rounded border border-red-600/50 hover:bg-red-600/20 text-red-400 transition-colors tooltip relative group" id="btn-clear">
                🗑️
                <span class="absolute -bottom-8 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Limpiar</span>
            </button>

            <div class="w-px h-6 bg-slate-600 mx-1"></div>

            <button class="tool-btn bg-green-500 hover:bg-green-400 text-slate-900 font-bold py-1.5 px-4 rounded shadow-[0_0_10px_rgba(34,197,94,0.4)] transition-all" id="generate-btn">
                🔥 FORJAR CONKY
            </button>
        </div>

        <!-- Área de Trabajo / Lienzo -->
        <div id="workspace" class="flex-1 overflow-auto flex items-start justify-center p-12 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]">
            <div id="canvas-wrapper" class="relative">
                <div id="conky-canvas" class="bg-black/60 border border-slate-700 shadow-2xl relative" style="width: 400px; height: 1000px; min-width: 400px; min-height: 1000px;"></div>
            </div>
        </div>

    </div>

    <!-- EL SCRIPT DE JAVASCRIPT: ¡Asegúrate de que la ruta 'js/script.js' es correcta! -->
    <script src="js/script.js"></script>
</body>
</html>
